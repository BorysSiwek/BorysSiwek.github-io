<!DOCTYPE html>   
 
 <body> 
 <div style="color:green;font-size:50px;"> 
  <script language="JavaScript"> 
    var m_siw=prompt("m=",""); 
    var b_siw; 
    var c_siw;
    var d_siw;
    var a_siw=parseFloat(m_siw); 
        b_siw=a_siw+2; 
        c_siw=(a_siw+1)*(a_siw+2); 
        d_siw=a_siw*(a_siw+1);
    document.write("1/"+a_siw+" = 1/"+b_siw+" + 1/" + c_siw + "+ 1/" + d_siw + "<br>"); 
  </script> 
 </div> 
 </body> 
</html>
