<!DOCTYPE html>   
<head>    
<title>Sprawdzenie danych Siwek</title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
do { 
var liczba1=prompt("bok a=",""); 
var a=parseFloat(liczba1); 
} 
while (a<=0); 
do { 
var liczba2=prompt("bok b=",""); 
var b=parseFloat(liczba2); 
}
while(!( b>0));
do { 
var liczba3=prompt("bok c=",""); 
var c=parseFloat(liczba3); 
} 
while (a<=0); 
while(!( b>0));
while(!( c>0)); 
while(!( a+b>c)); 
while(!( c+b>a)); 
while(!( a+c>b)); 
document.write("Good trójkąt"+"<br>"); 
</script> 
</div> 
</body> 
</html>
