<!DOCTYPE html>  
<html lang="pl-PL">  
                              <!-- polskie litery mają działać(uzupełnij w kodzie strony meta) --> 
         <title>siwe_Z35_JS</title>                      <!-- title -> Z35 oraz nazwisko ucznia --> 
     <body> 
 <div style="color:red;font-size:50px;"> 
    <script language="JavaScript"> 
  var x=prompt("podaj liczbę x=",""); 
               var a_dana_siw=parseFloat(x); 
//zmien zmienną „a” na a_dana_kow 
    document.write("czytana liczba x="+a_dana_siw+"<br>");     
               if(a_dana_siw>0) 
                      {document.write("czytana liczba jest większa od 0"+"<br>");} 
                if(a_dana_siw<0) 
                  {document.write("czytana liczba jest mniejsza od 0"+"<br>");}
                if(a_dana_siw=0) 
                  {document.write("czytana liczba jest równa 0"+"<br>");}
      </script> 
 </div> 
 </body> 
</html>
