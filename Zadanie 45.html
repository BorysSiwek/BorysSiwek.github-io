<!DOCTYPE html> 
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
var x_s=prompt("podaj liczbę:",""); 
document.write("Oto wszystkie liczby parzyste od 2 do "+x_s+": " + "<br>"); 
for(i_s=2;i_s<=x_s;i_s= i_s+2) 
{ 
document.write(i_s + "<br>"); 
} 
</script> 
</div> 
</body>
