<!DOCTYPE html>
 <head>
 <title> Użycie fukcji </title>
 <meta charset="utf-8">
 </head>
<body>
 <div style="color:navy;font-size:50px;">
<script language="JavaScript">
    var a=parseFloat(prompt("a=",""));
    var b=parseFloat(prompt("b=",""));
        
        function suma_siw(a, b) {
            return a + b;
        }

        function różnica_siw(a, b) {
            return a - b;
        }

        function iloczyn_siw(a, b) {
            return a * b;
        }

        function iloraz_siw(a, b) {
            return a / b;
        }

        function reszta_siw(a, b) {
            return a % b;
        }


 document.write("suma="+suma_siw(a,b)+"<br>");
 document.write("różnica="+różnica_siw(a,b)+"<br>");
 document.write("iloczyn="+iloczyn_siw(a,b)+"<br>");
 document.write("iloraz="+iloraz_siw(a,b)+"<br>");
  document.write("reszta z dzielenia="+reszta_siw(a,b)+"<br>");
</script>
</div>
</body>
</html>
