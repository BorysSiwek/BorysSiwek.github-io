<!DOCTYPE html> 
<html lang="pl"> 
<head>  
   <meta charset="utf-8"> 
    <title>  Przykład użycia pętli </title> 
  <script language="JavaScript"> 
   var x_siw=prompt("Ile razy powtórzyć?","");  
   var inicjaly_siw=prompt("podaj twoje inicjały: ")
   for ( var i=0; i<=x_siw; i++) 
    { 
       for ( var k=1; k<=i; k++) 
        { 
           document.write("&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp");     
         } 
         document.write(i+"_"+inicjaly_siw+"_"+i+"<br>"); 
     } 
  </script> 
</head>  
<body>  
</body>  
</html>
