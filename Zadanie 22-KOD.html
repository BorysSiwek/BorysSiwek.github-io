<html>

 <meta charset="UTF-8">
 <link rel="stylesheet" href="styl.css">
</head>
<body>
<script type="text/javascript">
 function pole_siwek()
 {
var a_siw= parseFloat(document.getElementById('dlugosc').value);
var b_siw= parseFloat(document.getElementById('dlugosc_2').value);
var c_siw= (a_siw * b_siw);
 document.getElementById("nazwa").innerHTML ="Obwód prostokąta= "+c_siw.toFixed(2)+" cm^2";
 }
 function obwod_siwek()
 {
var a_siw= parseFloat(document.getElementById('dlugosc').value);
var b_siw= parseFloat(document.getElementById('dlugosc_2').value);
var c_siw= (2*a_siw)+(2*b_siw);
 document.getElementById("nazwa").innerHTML ="Obwód prostokąta= "+c_siw.toFixed(2)+" cm";
 }
</script>
 <h1>Wszystko o PROSTOKĄCIE</h1><br><br>
 Podaj długość boku a: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br><br>
 Podaj długość boku b: <input type="text" id="dlugosc_2" value="podaj długość"> cm<br><br><br>
 <input type="button" name="pole" value="Oblicz pole" Onclick="pole_siwek()"><br><br>
 <input type="button" name="obwod" value="Oblicz obwod" Onclick="obwod_siwek()"><br><br>
 <div style="color:red;font-size:50px;"id="nazwa"></div>
</body>
