<!DOCTYPE html> 
<head> 
<title>obliczenie różnicy sekund między dniami w styczniu</title> 
<meta charset="utf-8"> 
</head> 
<body>
<div style="color:red;font-size:50px;">
 <script language="JavaScript">
var D1_siw=prompt("D1=","");
var G1_siw=prompt("G1=","");
var D2_siw=prompt("D2=","");
var G2_siw=prompt("G2=","");
var D1=parseFloat(D1_siw);
var D2=parseFloat(D2_siw);
var G1=parseFloat(G1_siw);
var G2=parseFloat(G2_siw);
var suma;

if (D1<=1 &&  D1>31 &&  D2<1 && D2>31) {
    alert("Podaj dni z zakresu 1–31!");
}
suma = ((D2 - D1) * 86400) + (G2 - G1) * 3600;
if (suma<0) {
    suma = (suma * (-1));
}
document.write("D1 = "+D1+"<br>D2 = "+D2+"<br>Ilość sekund = "+suma+"<br>");
</script>
</div>
</body>
</html>
